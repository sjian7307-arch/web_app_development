{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark">所有活動</h2>
    <a href="{{ url_for('event.new_event') }}" class="btn btn-primary shadow-sm">+ 建立新活動</a>
</div>

<div class="row">
    {% for event in events %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm border-0">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title text-primary fw-bold">{{ event.title }}</h5>
                <h6 class="card-subtitle mb-3 text-muted">人數上限: {{ event.capacity }} 人</h6>
                <p class="card-text flex-grow-1 text-truncate">{{ event.description or '無描述' }}</p>
                <div class="mt-3">
                    <a href="{{ url_for('event.detail', event_id=event.id) }}" class="btn btn-outline-info w-100 mb-2">查看詳情 / 報名</a>
                    <a href="{{ url_for('registration.list_registrations', event_id=event.id) }}" class="btn btn-outline-secondary w-100">管理名單 (主辦方)</a>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="alert alert-light text-center border">目前沒有任何活動。趕快舉辦一個吧！</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
